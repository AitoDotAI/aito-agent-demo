name: Frontend gate

# The frontend's rule tests (node --test: the first-visit tour, lib/tour.ts) and the
# type check, on every PR and on main. No browser, no backend, no Aito.
# The browser checks (./do tour-check) are local for now: they need a build and Chrome.

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mts
